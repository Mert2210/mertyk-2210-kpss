<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazililer KPSS Bilgi Bankası</title>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; text-align: center; margin: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .container { background: rgba(255,255,255,0.95); color: #333; width: 95%; max-width: 480px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h1, h2, h3, h4 { margin-top: 0; color: #1e3c72; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        button { background: #1e3c72; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:hover { opacity: 0.9; } button.green { background: #27ae60; } button.orange { background: #e67e22; } button.red { background: #c0392b; } button.outline { background: transparent; border: 2px solid #1e3c72; color: #1e3c72; } button.gold { background: #f1c40f; color:#333; }
        
        .opt-btn { background: #fff; color: #333; border: 2px solid #ddd; margin-bottom: 8px; text-align: left; }
        .opt-btn.selected { background: #e67e22 !important; color: #fff !important; border-color: #e67e22; }

        .auth-form { background: rgba(0,0,0,0.04); padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; }
        .auth-switch { color: #e67e22; font-size: 0.85rem; text-decoration: underline; cursor: pointer; text-align: center; display: block; margin-top: 10px; font-weight: bold; }

        .screen { display: none; } .active { display: block; }
        #lobby-players-area { background: #e8f4f8; padding: 10px; border-radius: 8px; border: 2px dashed #3498db; margin-top: 15px; text-align: left; }
        .player-badge { display: inline-block; background: #3498db; color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; margin: 3px; font-weight: bold; }
        
        #question-navigator { grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; display: none; }
        #question-navigator.show-map { display: grid; }
        .nav-box { width: 35px; height: 35px; display: flex; justify-content: center; align-items: center; background: #eee; border: 1px solid #ccc; border-radius: 6px; font-size: 0.85rem; font-weight: bold; color:#333; cursor: pointer; }
        .nav-box.current { border: 3px solid #e67e22; transform: scale(1.1); background:#fff; }
        .nav-box.correct { background: #27ae60 !important; color: white !important; }
        .nav-box.wrong { background: #c0392b !important; color: white !important; }
        .nav-box.answered { background: #3498db; color: white; }

        .dropdown-trigger { background: #fff; color: #333; border: 2px solid #e67e22; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: left; }
        .dropdown-content { display: none; background-color: #ffffff; width: 100%; border: 2px solid #1e3c72; border-radius: 8px; max-height: 200px; overflow-y: auto; margin-top: 5px; box-sizing: border-box; } 
        .dropdown-content.show { display: block; }
        .checkbox-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; } 
        .checkbox-item label { color: #1e3c72; font-weight: 600; flex: 1; text-align: left; margin:0; }
        
        .list-item { background: #f9f9f9; border: 1px solid #eee; padding: 10px; margin-bottom: 8px; border-radius: 8px; position: relative; }
        .list-item b { color: #1e3c72; }

        .timer-container { display: flex; justify-content: space-between; gap: 10px; }
        .timer-box { flex: 1; padding: 8px 15px; border-radius: 8px; font-weight: bold; color: #fff; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-auth" class="screen">
        <h1 style="font-size: 3rem; margin:0;">🎓</h1>
        <h1 style="font-size: 1.4rem; color:#1e3c72;">Gazililer KPSS Bilgi Bankası</h1>
        <div id="login-box" class="auth-form">
            <input type="email" id="login-email" placeholder="E-posta">
            <input type="password" id="login-pass" placeholder="Şifre">
            <button onclick="handleLogin()" class="green">Giriş Yap</button>
            <span class="auth-switch" onclick="handleResetPassword()" style="color:#2980b9; font-size:0.75rem;">Şifremi Unuttum?</span>
            <span class="auth-switch" onclick="switchAuth('register')">Kayıt Ol</span>
            <div style="display:flex; gap:8px; margin-top:15px;">
                <button onclick="handleGoogleLogin()" style="background:#db4437; flex:1;">🌐 Google</button>
                <button onclick="handleGuestLogin()" style="background:#7f8c8d; flex:1;">👤 Misafir</button>
            </div>
        </div>
        <div id="reg-box" class="auth-form" style="display:none;">
            <input type="email" id="reg-email" placeholder="E-posta">
            <input type="text" id="reg-username" placeholder="Kullanıcı Adı">
            <input type="password" id="reg-pass" placeholder="Şifre">
            <input type="password" id="reg-pass-confirm" placeholder="Şifre Tekrar">
            <button onclick="handleRegister()" class="outline">Kayıt Ol</button>
            <span class="auth-switch" onclick="switchAuth('login')">Giriş Yap</span>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <button onclick="logout()" class="outline" style="width:auto; margin-bottom:10px; font-size:0.8rem;">⬅️ Çıkış</button>
        <h2 id="display-user" style="color:#e67e22;">Hoş Geldin!</h2>
        
        <button onclick="goToLobby('trial')" class="purple">📝 Hızlı Deneme (Offline)</button>
        <button onclick="goToLobby('room')" class="orange" style="margin-top:10px;">🏠 Oda Kur / Katıl</button>
        
        <div style="background: rgba(0,0,0,0.03); padding: 15px; border-radius: 10px; margin-top: 20px;">
            <h4 style="margin: 0 0 10px 0; text-align: left; color:#333;">Ezber & Takip Listelerim</h4>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <button onclick="showLocalList('wrong')" class="red" style="font-size:0.85rem;">❌ Yanlışlar</button>
                <button onclick="showLocalList('fav')" class="gold" style="font-size:0.85rem;">⭐ Favoriler</button>
                <button onclick="showLocalList('blank')" class="outline" style="font-size:0.85rem;">⬜ Boşlar</button>
                <button onclick="showLocalList('report')" class="outline" style="font-size:0.85rem; border-color:#c0392b; color:#c0392b;">🚨 Hatalı Sorular</button>
                <button id="admin-report-btn" onclick="fetchAdminReports()" class="red" style="grid-column: span 2; font-size:0.85rem; background:#000; margin-top:5px; display:none;">👑 Tüm Hata Raporlarını Oku (Admin)</button>
            </div>
        </div>
    </div>

    <div id="screen-list" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 id="list-title" style="margin:0;">Liste</h3>
            <button id="pdf-btn" onclick="downloadPDF()" class="orange" style="width:auto; font-size:0.8rem; padding:8px 12px;">📄 PDF İndir</button>
        </div>
        <div id="list-content" style="max-height: 400px; overflow-y: auto; text-align:left; color:#333;"></div>
        <button onclick="showScreen('screen-main')" class="outline" style="margin-top:15px;">⬅️ Ana Menüye Dön</button>
    </div>

    <div id="screen-lobby" class="screen">
        <button class="outline" onclick="showScreen('screen-main')" style="width:auto; margin-bottom:15px;">⬅️ Geri</button>
        <div id="room-code-display" style="border-bottom:2px dashed #eee; padding-bottom:10px;">
            <h1 id="lobby-room-code" style="color:#e67e22;">----</h1>
        </div>
        
        <div id="lobby-players-area">
            <div id="lobby-players-list">Bekleniyor...</div>
        </div>
        
        <div id="lobby-settings" style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 10px; margin-top: 15px;">
            <label style="font-size:0.75rem; font-weight:bold; color:#c0392b;">SÜRE MODU</label>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button id="btn-mode-sec" onclick="setTimerMode('question')" class="green" style="flex:1; font-size:0.8rem;">Soru Başına (Sn)</button>
                <button id="btn-mode-min" onclick="setTimerMode('general')" class="outline" style="flex:1; font-size:0.8rem;">Toplam Deneme (Dk)</button>
            </div>
            
            <input type="number" id="room-q-time" placeholder="Örn: 45 (Saniye)" value="45">

            <div style="display:flex; gap:10px; margin-top:10px;">
                <div style="flex:1;">
                    <label style="font-size:0.75rem; font-weight:bold;">ZORLUK</label>
                    <select id="set-difficulty">
                        <option value="HEPSI">Tümü</option>
                        <option value="KOLAY">Kolay</option>
                        <option value="ORTA" selected>Orta</option>
                        <option value="ZOR">Zor</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label style="font-size:0.75rem; font-weight:bold;">ŞIK SAYISI</label>
                    <select id="set-options">
                        <option value="5" selected>5 Şık</option>
                        <option value="4">4 Şık</option>
                    </select>
                </div>
            </div>

            <label style="font-size:0.75rem; font-weight:bold; margin-top:10px; display:block;">SORU SAYISI</label>
            <input type="number" id="set-count" value="10">

            <label style="font-size:0.75rem; font-weight:bold; margin-top:10px; display:block;">KONU SEÇİMİ</label>
            <div class="dropdown-trigger" id="ders-trigger" onclick="toggleDropdown('ders-content')">Konular Yükleniyor... ▼</div>
            <div id="ders-content" class="dropdown-content"></div>

            <label style="font-size:0.75rem; font-weight:bold; margin-top:10px; display:block;">KAYNAK SEÇİMİ</label>
            <div class="dropdown-trigger" id="deneme-trigger" onclick="toggleDropdown('deneme-content')">Kaynaklar Yükleniyor... ▼</div>
            <div id="deneme-content" class="dropdown-content"></div>

            <button onclick="startGame()" class="green" style="margin-top:20px; width:100%;">🚀 SINAVI BAŞLAT</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="timer-container" style="flex:1;">
                <div id="box-total" class="timer-box" style="background:#2980b9;">⌛ <span id="time-total">--:--</span></div>
                <div id="box-question" class="timer-box" style="background:#c0392b; display:block;">⏱️ <span id="time-q">--s</span></div>
            </div>
            <button onclick="document.getElementById('question-navigator').classList.toggle('show-map')" class="outline" style="width:auto; padding:8px; margin-left:10px;">🗺️ Harita</button>
        </div>
        
        <div id="question-navigator"></div>
        
        <div id="trial-nav-buttons" style="display:none; justify-content:space-between; margin-top:15px;">
            <button onclick="trialPrev()" class="outline" style="width:48%;">⬅️ Geri</button>
            <button onclick="trialNext()" class="outline" style="width:48%;">İleri ➡️</button>
        </div>
        
        <div style="position:relative; margin-top:15px; min-height: 40px;">
            <button onclick="reportQuestion()" style="position:absolute; left:0; top:0; background:transparent; border:none; font-size:1.4rem; color:#c0392b; width:auto; padding:0; cursor:pointer;" title="Hatalı Soru Bildir">🚨</button>
            <button id="btn-fav-current" onclick="toggleFavCurrent()" style="position:absolute; right:0; top:0; background:transparent; border:none; font-size:1.6rem; color:#ccc; width:auto; padding:0; cursor:pointer;">☆</button>
            <h3 id="q-text" style="text-align:left; line-height:1.4; margin:0; padding: 0 40px;">Soru Yükleniyor...</h3>
        </div>
        
        <div id="opts-area" style="margin-top:20px;"></div>
        
        <button id="btn-finish-trial" onclick="finishTrial()" class="red" style="margin-top:20px; display:none;">🛑 Sınavı Bitir</button>
        
        <div id="live-scores-container" style="margin-top:20px; border-top:1px solid #eee; padding-top:10px;">
            <div id="live-scores-list"></div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h2>🏆 SONUÇLAR</h2>
        <div id="result-board"></div>
        <button onclick="showLocalList('wrong')" class="orange" style="margin-top:15px;">🔍 YANLIŞLARI İNCELE</button>
        <button onclick="location.reload()" class="outline" style="margin-top:10px;">ANA MENÜ</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, updateProfile, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, signOut, GoogleAuthProvider, signInWithPopup, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    
    const firebaseConfig = { apiKey: "AIzaSyDkZI-LxCOaog4kyb4YSquEK6ZpLNH2pqs", authDomain: "kpss-genel-kultur-soru-havuzu.firebaseapp.com", projectId: "kpss-genel-kultur-soru-havuzu", appId: "1:435941343639:web:3ce323e0f8386d796c04d2" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // TÜRKÇE HATA ÇEVİRİ MOTORU
    function getTurkishError(error) {
        switch (error.code) {
            case 'auth/invalid-credential': return "❌ Giriş Başarısız: E-posta veya şifre hatalı.";
            case 'auth/user-not-found': return "❌ Böyle bir kullanıcı bulunamadı.";
            case 'auth/wrong-password': return "❌ Şifre yanlış.";
            case 'auth/email-already-in-use': return "❌ Bu e-posta zaten başka bir hesaba kayıtlı.";
            case 'auth/weak-password': return "❌ Şifre çok zayıf (En az 6 karakter).";
            case 'auth/invalid-email': return "❌ Geçersiz e-posta formatı.";
            case 'auth/network-request-failed': return "❌ Ağ bağlantı hatası. İnternetinizi kontrol edin.";
            default: return "❌ Bir hata oluştu: " + error.message;
        }
    }

    window.switchAuth = (t) => { document.getElementById('login-box').style.display = t === 'login' ? 'block' : 'none'; document.getElementById('reg-box').style.display = t === 'register' ? 'block' : 'none'; };
    
    window.handleLogin = async () => { 
        try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value.trim(), document.getElementById('login-pass').value); } 
        catch(e) { alert(getTurkishError(e)); } 
    };

    window.handleRegister = async () => {
        const e = document.getElementById('reg-email').value.trim();
        const u = document.getElementById('reg-username').value;
        const p1 = document.getElementById('reg-pass').value;
        const p2 = document.getElementById('reg-pass-confirm').value;
        if(p1 !== p2) return alert("❌ Şifreler uymuyor!");
        try { 
            const res = await createUserWithEmailAndPassword(auth, e, p1); 
            await updateProfile(res.user, { displayName: u }); 
            await sendEmailVerification(res.user);
            alert("✅ Kayıt başarılı! Doğrulama linki e-postanıza gönderildi.");
            location.reload(); 
        } catch(e) { alert(getTurkishError(e)); }
    };

    window.handleGuestLogin = async () => { 
        try { 
            const guestName = "Misafir-" + Math.floor(1000 + Math.random() * 9000);
            const res = await signInAnonymously(auth); 
            await updateProfile(res.user, { displayName: guestName });
            location.reload();
        } catch(e) { alert("Bağlantı Hatası"); } 
    };

    // ŞİFRE SIFIRLAMA
    window.handleResetPassword = async () => {
        const email = document.getElementById('login-email').value.trim();
        if(!email) return alert("❌ Lütfen önce e-posta adresinizi yazın.");
        try {
            await sendPasswordResetEmail(auth, email);
            alert("📩 Şifre sıfırlama bağlantısı e-postanıza gönderildi!");
        } catch(e) { alert(getTurkishError(e)); }
    };

    window.handleGoogleLogin = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch(e) { alert(e.message); } };

    onAuthStateChanged(auth, user => {
        const adminBtn = document.getElementById('admin-report-btn');
        if (user) { 
            document.getElementById('display-user').innerText = "Hoş Geldin, " + (user.displayName || "Gazi");
            // ADMIN BUTONU KONTROLÜ
            if (user.email === "kayamert319@gmail.com") { adminBtn.style.display = "block"; } else { adminBtn.style.display = "none"; }
            showScreen('screen-main'); 
        } 
        else showScreen('screen-auth');
    });
    window.logout = () => signOut(auth).then(() => location.reload());
</script>

<script>
    const socket = io();
    let currentMode = "room", myRoom = "", currentQIndex = 0, qInt = null, totalInt = null, trialQuestions = [], trialAnswers = [];
    let currentQObject = null; 
    let currentListType = ""; 
    let selectedTimerMode = "question";

    window.showScreen = (id) => { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); };
    window.toggleDropdown = (id) => document.getElementById(id).classList.toggle('show');

    window.setTimerMode = (mode) => {
        selectedTimerMode = mode;
        document.getElementById('btn-mode-sec').className = mode === 'question' ? 'green' : 'outline';
        document.getElementById('btn-mode-min').className = mode === 'general' ? 'green' : 'outline';
        document.getElementById('room-q-time').placeholder = mode === 'question' ? 'Örn: 45 (Saniye)' : 'Örn: 15 (Dakika)';
    };

    function saveToLocal(key, qObj) { let list = JSON.parse(localStorage.getItem(key)) || []; if(!list.find(x => x.soru === qObj.soru)) { list.push(qObj); localStorage.setItem(key, JSON.stringify(list)); } }
    function removeFromLocal(key, qObj) { let list = JSON.parse(localStorage.getItem(key)) || []; list = list.filter(x => x.soru !== qObj.soru); localStorage.setItem(key, JSON.stringify(list)); }
    function checkIsFav(qObj) { return (JSON.parse(localStorage.getItem('kpss_favs')) || []).some(x => x.soru === qObj.soru); }

    window.toggleFavCurrent = () => {
        if(!currentQObject) return;
        const btn = document.getElementById('btn-fav-current');
        if(checkIsFav(currentQObject)) { removeFromLocal('kpss_favs', currentQObject); btn.style.color = "#ccc"; btn.innerText = "☆"; } 
        else { saveToLocal('kpss_favs', currentQObject); btn.style.color = "#f1c40f"; btn.innerText = "⭐"; }
    };

    window.reportQuestion = () => {
        if(!currentQObject) return;
        socket.emit('reportQuestion', currentQObject);
        saveToLocal('kpss_reports', currentQObject);
        alert("🚨 Bu soru merkezi sisteme bildirildi.");
    };

    window.fetchAdminReports = () => { socket.emit("adminGetReports"); };

    socket.on("allReportsData", (data) => {
        currentListType = "admin_report";
        document.getElementById('list-title').innerText = "👑 Merkezi Hata Raporları";
        const contentDiv = document.getElementById('list-content');
        if(data.length === 0) { contentDiv.innerHTML = "<p style='text-align:center;'>Henüz rapor yok.</p>"; } 
        else {
            contentDiv.innerHTML = data.map((q, i) => `<div class="list-item" style="border-left: 5px solid #c0392b;"><b>Soru:</b> ${q.soru} <br><span style="color:#27ae60;"><b>Cevap:</b> ${q.siklar ? q.siklar[q.dogru] : '---'}</span> <br><small style="color:#666;">Tarih: ${q.reportedAt || '---'}</small></div>`).join('');
        }
        showScreen('screen-list');
    });

    window.showLocalList = (type) => {
        currentListType = type;
        const keys = { 'wrong': 'kpss_wrongs', 'fav': 'kpss_favs', 'blank': 'kpss_blanks', 'report': 'kpss_reports' };
        const titles = { 'wrong': '❌ Yanlışlarım', 'fav': '⭐ Favorilerim', 'blank': '⬜ Boş Bıraktıklarım', 'report': '🚨 Hatalı Bildirdiklerim' };
        document.getElementById('list-title').innerText = titles[type];
        const list = JSON.parse(localStorage.getItem(keys[type])) || [];
        const contentDiv = document.getElementById('list-content');
        if(list.length === 0) contentDiv.innerHTML = "<p style='text-align:center;'>Bu liste şu an boş.</p>";
        else {
            contentDiv.innerHTML = list.map((q, i) => `<div class="list-item"><b>Soru ${i+1}:</b> ${q.soru} <br><span style="color:#27ae60; font-weight:bold; font-size:0.9rem;">Cevap: ${q.siklar ? q.siklar[q.dogru] : 'Bilinmiyor'}</span></div>`).join('');
        }
        showScreen('screen-list');
    };

    window.downloadPDF = () => {
        const keys = { 'wrong': 'kpss_wrongs', 'fav': 'kpss_favs', 'blank': 'kpss_blanks', 'report': 'kpss_reports' };
        const list = JSON.parse(localStorage.getItem(keys[currentListType])) || [];
        if(list.length === 0) return alert("Liste boş!");
        const win = window.open('', '', 'height=600,width=800');
        win.document.write('<html><body style="font-family:sans-serif;"><h2>Gazililer KPSS</h2><hr>');
        list.forEach((q, i) => win.document.write(`<p><b>Soru ${i+1}:</b> ${q.soru}<br><span style="color:green;">Cevap: ${q.siklar[q.dogru]}</span></p>`));
        win.document.write('</body></html>'); win.document.close(); win.print();
    };

    window.goToLobby = (mode) => {
        currentMode = mode;
        if (mode === 'room') {
            socket.emit('createRoom', { username: "Gazi" });
            document.getElementById('room-code-display').style.display = 'block';
            document.getElementById('lobby-players-area').style.display = 'block';
        } else {
            document.getElementById('room-code-display').style.display = 'none';
            document.getElementById('lobby-players-area').style.display = 'none';
        }
        showScreen('screen-lobby');
    };

    socket.on('roomCreated', c => { myRoom = c; document.getElementById('lobby-room-code').innerText = c; });
    socket.on('updatePlayerList', p => { const l = document.getElementById('lobby-players-list'); if(l) l.innerHTML = p.map(x => `<span class="player-badge">${x.username}</span>`).join(''); });
    
    socket.on('updateSubjectList', list => {
        document.getElementById('ders-content').innerHTML = `<div class="checkbox-item" onclick="this.querySelector('input').click()"><input type="checkbox" name="ders-secim" value="HEPSI" checked onclick="event.stopPropagation()"><label>TÜMÜ</label></div>` + list.map(x => `<div class="checkbox-item" onclick="this.querySelector('input').click()"><input type="checkbox" name="ders-secim" value="${x}" checked onclick="event.stopPropagation()"><label>${x}</label></div>`).join('');
        document.getElementById('ders-trigger').innerText = "Konular Seçildi ▼";
    });
    
    socket.on('updateDenemeList', data => {
        document.getElementById('deneme-content').innerHTML = `<div class="checkbox-item" onclick="this.querySelector('input').click()"><input type="checkbox" name="deneme-secim" value="HEPSI" checked onclick="event.stopPropagation()"><label>TÜMÜ</label></div>` + Object.keys(data.denemeler).map(x => `<div class="checkbox-item" onclick="this.querySelector('input').click()"><input type="checkbox" name="deneme-secim" value="${x}" onclick="event.stopPropagation()"><label>${x}</label></div>`).join('');
        document.getElementById('deneme-trigger').innerText = "Kaynaklar Seçildi ▼";
    });

    window.startGame = () => {
        const dur = parseInt(document.getElementById('room-q-time').value);
        if(!dur || dur <= 0) return alert("Süre zorunludur!");
        const d = []; document.querySelectorAll('input[name="ders-secim"]:checked').forEach(c => d.push(c.value));
        const k = []; document.querySelectorAll('input[name="deneme-secim"]:checked').forEach(c => k.push(c.value));
        const s = { count: document.getElementById('set-count').value, subject: d.includes("HEPSI") ? "HEPSI" : d, deneme: k.includes("HEPSI") ? "HEPSI" : k, difficulty: document.getElementById('set-difficulty').value, optionsCount: parseInt(document.getElementById('set-options').value), timerMode: selectedTimerMode, duration: dur };
        if (currentMode === 'trial') socket.emit('startTrial', s); else socket.emit('startGame', { roomCode: myRoom, settings: s });
    };

    socket.on('newQuestion', d => {
        showScreen('screen-game');
        currentQObject = d; 
        document.getElementById('opts-area').innerHTML = "";
        currentQIndex = d.index - 1;
        document.getElementById('q-text').innerText = d.soru;
        document.getElementById('box-question').style.display = (d.timerMode === 'question') ? 'block' : 'none';
        document.getElementById('box-total').style.display = (d.timerMode === 'general') ? 'block' : 'none';
        if(d.timerMode === 'general' && d.index === 1) startTotalTimer(d.duration);
        if(d.timerMode === 'question') startQuestionTimer(d.duration);
        renderNavigator(d.total, currentQIndex, 'room');
        d.siklar.forEach((s, i) => {
            const b = document.createElement('button'); b.innerText = s; b.className = "opt-btn";
            b.onclick = () => {
                document.querySelectorAll('.opt-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                socket.emit('submitAnswer', {roomCode: myRoom, answerIndex: i});
                clearInterval(qInt);
            };
            document.getElementById('opts-area').appendChild(b);
        });
    });

    socket.on('answerResult', data => {
        const b = document.getElementById('nav-box-' + currentQIndex);
        if(b) b.classList.add(data.correct ? 'correct' : 'wrong');
        if(!data.correct) {
            if(data.selectedIndex === -1) saveToLocal('kpss_blanks', currentQObject);
            else saveToLocal('kpss_wrongs', currentQObject);
        }
    });

    socket.on('trialStarted', data => {
        trialQuestions = data.questions || data; 
        trialAnswers = new Array(trialQuestions.length).fill(null); 
        currentQIndex = 0;
        showScreen('screen-game');
        document.getElementById('trial-nav-buttons').style.display = 'flex';
        document.getElementById('btn-finish-trial').style.display = 'block';
        if(data.timerMode === 'general') { document.getElementById('box-total').style.display = 'block'; startTotalTimer(data.duration); }
        renderTrialQuestion();
    });

    function renderTrialQuestion() {
        currentQObject = trialQuestions[currentQIndex];
        document.getElementById('q-text').innerText = `(${currentQIndex+1}/${trialQuestions.length}) ` + currentQObject.soru;
        renderNavigator(trialQuestions.length, currentQIndex, 'trial');
        const a = document.getElementById('opts-area'); a.innerHTML = "";
        currentQObject.siklar.forEach((s, i) => {
            const b = document.createElement('button'); b.innerText = s;
            b.className = "opt-btn" + (trialAnswers[currentQIndex] === i ? " selected" : "");
            b.onclick = () => { trialAnswers[currentQIndex] = i; renderTrialQuestion(); };
            a.appendChild(b);
        });
    }

    window.trialNext = () => { if(currentQIndex < trialQuestions.length-1) { currentQIndex++; renderTrialQuestion(); } };
    window.trialPrev = () => { if(currentQIndex > 0) { currentQIndex--; renderTrialQuestion(); } };
    
    window.finishTrial = () => {
        if(totalInt) clearInterval(totalInt); 
        let s = 0; let d = 0; let y = 0; let b = 0;
        trialQuestions.forEach((q, i) => { 
            if(trialAnswers[i] === q.dogru) { s+=10; d++; } 
            else if(trialAnswers[i] !== null) { s-=5; y++; saveToLocal('kpss_wrongs', q); }
            else { b++; saveToLocal('kpss_blanks', q); }
        });
        showScreen('screen-result'); 
        document.getElementById('result-board').innerHTML = `<h3 style="color:#333;">Doğru: ${d} | Yanlış: ${y} | Boş: ${b}</h3><h2>Puan: ${s}</h2>`;
        confetti({ particleCount: 150 });
    };

    function startQuestionTimer(s) { 
        let t = s; if(qInt) clearInterval(qInt);
        qInt = setInterval(() => { t--; document.getElementById('time-q').innerText = t + "s"; if(t<=0) { clearInterval(qInt); socket.emit('submitAnswer', {roomCode: myRoom, answerIndex: -1}); }}, 1000);
    }

    function startTotalTimer(minutes) {
        let t = minutes * 60; if(totalInt) clearInterval(totalInt);
        totalInt = setInterval(() => {
            t--; let m = Math.floor(t/60), sec = t%60;
            document.getElementById('time-total').innerText = `${m}:${sec<10?'0'+sec:sec}`;
            if(t<=0) { clearInterval(totalInt); if(currentMode === 'trial') window.finishTrial(); }
        }, 1000);
    }

    function renderNavigator(total, curr, mode) {
        const div = document.getElementById('question-navigator');
        if(div.innerHTML === "") {
            for(let i=0; i<total; i++) {
                const b = document.createElement('div'); b.id = 'nav-box-'+i; b.className = 'nav-box'; b.innerText = i+1;
                if(mode === 'trial') b.onclick = () => { currentQIndex = i; renderTrialQuestion(); };
                div.appendChild(b);
            }
        }
        document.querySelectorAll('.nav-box').forEach(x => x.classList.remove('current'));
        const cb = document.getElementById('nav-box-' + curr);
        if(cb) {
            cb.classList.add('current');
            if(mode === 'trial') {
                for(let i=0; i<total; i++) {
                    let box = document.getElementById('nav-box-'+i);
                    if(trialAnswers[i] !== null) box.classList.add('answered'); else box.classList.remove('answered');
                }
            }
        }
    }
</script>
</body>
</html>
