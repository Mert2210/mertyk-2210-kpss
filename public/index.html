<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYK 2210 - KPSS Eğitim & Yarışma Platformu</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1e3c72">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        /* --- GENEL SAYFA YAPISI --- */
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #fff; text-align: center; margin: 0; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow-y: auto; padding: 20px 0; }
        .container { background: rgba(255,255,255,0.95); color: #333; width: 95%; max-width: 480px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; margin-bottom: 20px; }
        h1, h2, h3, h4 { margin-top: 0; color: #1e3c72; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
        button { background: #1e3c72; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.green { background: #27ae60; } button.orange { background: #e67e22; } button.red { background: #c0392b; }
        button.purple { background: #8e44ad; } button.gold { background: #f1c40f; color: #333; }
        button.outline { background: transparent; border: 2px solid #1e3c72; color: #1e3c72; }

        /* --- ÇİFT SAYAÇ TASARIMI --- */
        .timer-container { display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px; }
        .timer-box { flex: 1; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 0.9rem; color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #box-total { background: #2980b9; } 
        #box-question { background: #c0392b; }

        /* --- DROPDOWN FİX (OKUNABİLİRLİK) --- */
        .dropdown-content { display: none; position: absolute; background-color: #fff !important; width: 100%; border: 2px solid #1e3c72; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 100; max-height: 200px; overflow-y: auto; left: 0; }
        .dropdown-content.show { display: block; }
        .checkbox-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; text-align: left; background: #fff !important; }
        .checkbox-item label { color: #1e3c72 !important; font-weight: 600 !important; flex: 1; cursor: pointer; margin: 0; }
        .checkbox-item input { margin-right: 12px; transform: scale(1.3); }

        /* --- DİĞER EKRANLAR --- */
        .screen { display: none; } .active { display: block; animation: fadeIn 0.3s; }
        #rank-display { background: linear-gradient(to right, #f1c40f, #f39c12); color: white; padding: 12px 15px; border-radius: 12px; margin-bottom: 15px; text-align: left; cursor: pointer; }
        .progress-bar { height: 6px; background-color: #fff; width: 0%; transition: width 0.8s; border-radius: 3px; }
        #question-navigator { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 15px; padding: 10px; background: #f1f2f6; border-radius: 8px; }
        .nav-box { width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; background: #fff; border: 1px solid #ccc; border-radius: 4px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .nav-box.correct { background: #27ae60; color: white; } .nav-box.wrong { background: #c0392b; color: white; }
        
        .flashcard-container { perspective: 1000px; width: 100%; height: 320px; margin: 20px 0; }
        .flashcard { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; position: relative; }
        .flashcard.is-flipped { transform: rotateY(180deg); }
        .flashcard-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 3px solid #1e3c72; background: #fff; }
        .flashcard-back { background-color: #1e3c72; color: white; transform: rotateY(180deg); }
        
        #rank-table-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; color: #333; padding: 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.6); z-index: 200; width: 85%; max-width: 320px; }
    </style>
</head>
<body>

<audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
<audio id="snd-wrong" src="https://assets.mixkit.co/active_storage/sfx/2021/2021-preview.mp3"></audio>

<div id="rank-table-modal">
    <h3 style="text-align:center;">📊 Seviye Sistemi</h3>
    <div id="rank-table-content"></div>
    <button onclick="document.getElementById('rank-table-modal').style.display='none'" class="red" style="margin-top:15px;">Kapat</button>
</div>

<div class="container">
    <div id="screen-auth" class="screen active">
        <h1 style="font-size: 3rem; margin-bottom:0;">🎓</h1>
        <h1>MYK 2210</h1>
        <div style="background: rgba(0,0,0,0.04); padding: 15px; border-radius: 10px; margin-bottom: 15px;">
            <input type="text" id="username-input" placeholder="Kullanıcı Adı Belirleyin">
            <button onclick="doLogin('google')" class="orange" style="background:#db4437">🌐 Google Girişi (Redirect)</button>
            <button onclick="doLogin('guest')" class="guest" style="background:#7f8c8d">👤 Misafir Girişi</button>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <button onclick="logout()" class="outline" style="width:auto; margin-bottom:10px;">⬅️ Çıkış</button>
        <h2 id="display-user" style="color:#e67e22;">Hoş Geldin!</h2>
        <div id="rank-display" onclick="openRankModal()">
            <span id="rank-title">⭐ 1. Seviye</span>
            <span id="total-points-display" style="float:right; font-size:0.8rem;">0 Puan</span>
            <div style="width:100%; background:rgba(255,255,255,0.3); height:6px; border-radius:3px; margin-top:5px;">
                <div class="progress-bar" id="rank-progress"></div>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
            <button onclick="startTrial()" class="purple">📝 Hızlı Deneme</button>
            <button onclick="createRoom()" class="outline">🏠 Oda Kur</button>
            <button onclick="showScreen('screen-stats'); loadStats();" class="green" style="grid-column: span 2;">📊 Başarı Analizi</button>
        </div>
        <h4 style="margin: 20px 0 5px 0; text-align: left;">Ezber & Takip</h4>
        <button onclick="startFlashcardsMode()" class="gold">🔥 Soru Havuzundan Öğren</button>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
            <button onclick="showLocalList('wrong')" class="red" style="font-size:0.8rem;">❌ Yanlışlar</button>
            <button onclick="showLocalList('fav')" class="outline" style="font-size:0.8rem;">⭐ Yıldızlılar</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen">
        <button class="outline" onclick="showScreen('screen-main')" style="width:auto;">⬅️ Geri</button>
        <h3>Sınav Hazırlığı</h3>
        <div style="text-align: left; background: #f9f9f9; padding: 15px; border-radius: 10px;">
            <label style="font-size:0.75rem; font-weight:bold;">Soru Sayısı:</label>
            <input type="number" id="set-count" value="10">
            <label style="font-size:0.75rem; font-weight:bold;">Toplam Dakika:</label>
            <select id="set-total-time"><option value="0">Sınırsız</option><option value="10" selected>10 Dakika</option><option value="45">45 Dakika</option></select>
            <label style="font-size:0.75rem; font-weight:bold;">Soru Başı Saniye:</label>
            <select id="set-q-time"><option value="0">Sınırsız</option><option value="45" selected>45 Saniye</option><option value="60">60 Saniye</option></select>
            
            <label style="font-size:0.75rem; font-weight:bold;">Kaynak Seçimi:</label>
            <div class="dropdown-wrapper">
                <div class="dropdown-trigger" id="deneme-trigger" onclick="toggleDropdown('deneme-content')">Kaynaklar Yükleniyor...</div>
                <div id="deneme-content" class="dropdown-content"></div>
            </div>
            <button onclick="startGame()" class="orange" style="margin-top:20px;">🚀 BAŞLAT</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="timer-container">
            <div id="box-total" class="timer-box">⌛ Toplam: <span id="time-total">--:--</span></div>
            <div id="box-question" class="timer-box">⏱️ Soru: <span id="time-q">--s</span></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span id="q-lesson" style="background:#e67e22; color:white; padding:4px 8px; border-radius:4px; font-size:0.8rem;">DERS</span>
            <span id="q-count" style="font-weight:bold;">1/10</span>
        </div>
        <div id="question-navigator"></div>
        <h3 id="q-text" style="text-align:left; line-height:1.4; margin: 20px 0;">Yükleniyor...</h3>
        <div id="opts-area"></div>
        <button onclick="submitBlank()" style="background:#95a5a6; margin-top:10px;">⚪ BOŞ BIRAK</button>
    </div>

    <div id="screen-flashcard" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button onclick="showScreen('screen-main')" class="outline" style="width:auto;">Kapat</button>
            <span id="fc-counter" style="font-weight:bold;">1/20</span>
        </div>
        <div class="flashcard-container" onclick="document.getElementById('fc-inner').classList.toggle('is-flipped')">
            <div id="fc-inner" class="flashcard">
                <div class="flashcard-face">
                    <small id="fc-lesson" style="color:#888; position:absolute; top:10px;"></small>
                    <div id="fc-q-text" style="font-weight:bold;">Soru...</div>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div id="fc-a-text" style="color:#2ecc71; font-weight:bold; font-size:1.2rem;"></div>
                    <div id="fc-sol-text" style="font-size:0.8rem; margin-top:10px;"></div>
                </div>
            </div>
        </div>
        <button onclick="markAsLearned()" class="gold">✅ Öğrendim</button>
        <button onclick="nextFlashcard()" class="green" style="margin-top:5px;">Sıradaki ❯</button>
    </div>

    <div id="screen-stats" class="screen">
        <button class="outline" onclick="showScreen('screen-main')" style="width:auto;">⬅️ Geri</button>
        <h2>📊 Başarı Analizi</h2>
        <div style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between;">
            <span>Toplam Soru:</span><b id="stat-total" style="color:#e67e22;">0</b>
        </div>
        <div style="background:#f8f9fa; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between;">
            <span>Doğru Sayısı:</span><b id="stat-correct" style="color:#27ae60;">0</b>
        </div>
        <button onclick="localStorage.removeItem('kpss_stats'); loadStats();" class="red" style="font-size:0.8rem;">Verileri Sıfırla</button>
    </div>

    <div id="screen-list" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="list-title">Liste</h3>
            <button id="pdf-btn" onclick="downloadPDF()" class="orange" style="width:auto; font-size:0.8rem;">📄 PDF</button>
        </div>
        <div id="list-content" style="max-height: 350px; overflow-y: auto; text-align:left;"></div>
        <button onclick="showScreen('screen-main')" class="outline" style="margin-top:10px;">Dön</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithRedirect, GoogleAuthProvider, signInAnonymously, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDkZI-LxCOaog4kyb4YSquEK6ZpLNH2pqs",
        authDomain: "kpss-genel-kultur-soru-havuzu.firebaseapp.com",
        projectId: "kpss-genel-kultur-soru-havuzu",
        appId: "1:435941343639:web:3ce323e0f8386d796c04d2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.doLogin = async (type) => {
        const name = document.getElementById('username-input').value.trim();
        if(!name) return alert("Lütfen isim belirleyin!");
        localStorage.setItem('saved_username', name);
        if(type === 'google') signInWithRedirect(auth, new GoogleAuthProvider());
        else {
            const res = await signInAnonymously(auth);
            await updateProfile(res.user, { displayName: name });
            location.reload();
        }
    };

    onAuthStateChanged(auth, user => {
        if (user) {
            document.getElementById('display-user').innerText = "Hoş Geldin, " + (localStorage.getItem('saved_username') || user.displayName || "Oyuncu");
            showScreen('screen-main');
            window.updateRankDisplay();
        } else showScreen('screen-auth');
    });

    window.logout = () => { signOut(auth); localStorage.clear(); location.reload(); };
</script>

<script>
    const socket = io();
    let myRoom = "", currentQ = null, totalInt = null, qInt = null, questionStatus = [];

    window.showScreen = (id) => {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    };

    window.toggleDropdown = (id) => document.getElementById(id).classList.toggle('show');

    // KAYNAK YÜKLEME
    socket.on('updateDenemeList', data => {
        const div = document.getElementById('deneme-content');
        document.getElementById('deneme-trigger').innerText = "Kaynak Seçiniz ▼";
        div.innerHTML = "";
        Object.keys(data.denemeler).forEach(k => {
            div.innerHTML += `<div class="checkbox-item" onclick="this.querySelector('input').click()">
                <input type="checkbox" name="deneme-secim" value="${k}" checked onclick="event.stopPropagation()">
                <label>${k}</label></div>`;
        });
    });

    window.startTrial = () => socket.emit('createRoom', {username: localStorage.getItem('saved_username') || "Misafir"});
    window.createRoom = () => socket.emit('createRoom', {username: localStorage.getItem('saved_username') || "Ev Sahibi"});

    socket.on('roomCreated', c => { myRoom = c; showScreen('screen-lobby'); });

    window.startGame = () => {
        const totalMin = parseInt(document.getElementById('set-total-time').value);
        const qSecLimit = parseInt(document.getElementById('set-q-time').value);
        let d = []; document.querySelectorAll('input[name="deneme-secim"]:checked').forEach(c => d.push(c.value));
        if(totalMin > 0) startTotalTimer(totalMin * 60);
        socket.emit('startGame', { roomCode: myRoom, settings: { count: document.getElementById('set-count').value, deneme: d }});
    };

    function startTotalTimer(secs) {
        let t = secs;
        totalInt = setInterval(() => {
            t--;
            let m = Math.floor(t/60), s = t%60;
            document.getElementById('time-total').innerText = `${m}:${s<10?'0'+s:s}`;
            if(t <= 0) { clearInterval(totalInt); alert("Süre Bitti!"); location.reload(); }
        }, 1000);
    }

    socket.on('newQuestion', d => {
        showScreen('screen-game');
        currentQ = d;
        const qLimit = parseInt(document.getElementById('set-q-time').value);
        if(qLimit > 0) startQuestionTimer(qLimit);

        document.getElementById('q-count').innerText = d.index + "/" + d.total;
        document.getElementById('q-lesson').innerText = d.ders;
        document.getElementById('q-text').innerText = d.soru;
        renderNavigator(d.total, d.index-1);

        const area = document.getElementById('opts-area'); area.innerHTML = "";
        d.siklar.forEach((s, i) => {
            const b = document.createElement('button');
            b.innerText = s; b.className = 'opt-btn';
            b.style.background = "#eef2f3"; b.style.color="#333"; b.style.padding="12px"; b.style.margin="5px 0"; b.style.width="100%"; b.style.borderRadius="8px"; b.style.border="1px solid #ddd";
            b.onclick = () => { clearInterval(qInt); socket.emit('submitAnswer', {roomCode: myRoom, answerIndex: i}); };
            area.appendChild(b);
        });
    });

    function startQuestionTimer(s) {
        let t = s; if(qInt) clearInterval(qInt);
        qInt = setInterval(() => {
            t--; document.getElementById('time-q').innerText = t + "s";
            if(t <= 0) { clearInterval(qInt); socket.emit('submitAnswer', {roomCode: myRoom, answerIndex: -1}); }
        }, 1000);
    }

    function renderNavigator(total, curr) {
        const div = document.getElementById('question-navigator'); div.innerHTML = "";
        for(let i=0; i<total; i++) {
            const b = document.createElement('div'); b.className = 'nav-box';
            if(i === curr) b.style.border = "2px solid #e67e22";
            b.innerText = i+1; div.appendChild(b);
        }
    }

    // RÜTBE VE İSTATİSTİK
    const rankLevels = [{name: "1. Seviye", limit: 300}, {name: "2. Seviye", limit: 750}, {name: "3. Seviye", limit: 1800}, {name: "Zirve", limit: 999999}];
    window.updateRankDisplay = () => {
        let pts = parseInt(localStorage.getItem('kpss_pts')) || 0;
        document.getElementById('total-points-display').innerText = pts + " Puan";
        let rank = rankLevels.find(r => pts < r.limit) || rankLevels[rankLevels.length-1];
        document.getElementById('rank-title').innerText = "⭐ " + rank.name;
        document.getElementById('rank-progress').style.width = Math.min(100, (pts/rank.limit)*100) + "%";
    };

    window.loadStats = () => {
        const s = JSON.parse(localStorage.getItem('kpss_stats')) || { total: 0, correct: 0 };
        document.getElementById('stat-total').innerText = s.total;
        document.getElementById('stat-correct').innerText = s.correct;
    };

    // ÖĞRENME MODU
    let fcList = [], fcIdx = 0;
    window.startFlashcardsMode = async () => {
        const res = await fetch('questions.json'); const all = await res.json();
        fcList = all.sort(() => 0.5 - Math.random()).slice(0, 20);
        fcIdx = 0; renderFC(); showScreen('screen-flashcard');
    };
    function renderFC() {
        const q = fcList[fcIdx];
        document.getElementById('fc-counter').innerText = (fcIdx+1) + "/20";
        document.getElementById('fc-lesson').innerText = q.ders;
        document.getElementById('fc-q-text').innerText = q.soru;
        document.getElementById('fc-a-text').innerText = "✅ " + q.siklar[q.dogru];
        document.getElementById('fc-sol-text').innerText = q.cozum || "";
        document.getElementById('fc-inner').classList.remove('is-flipped');
    }
    window.nextFlashcard = () => { if(fcIdx < 19) { fcIdx++; renderFC(); } else showScreen('screen-main'); };
    window.markAsLearned = () => window.nextFlashcard();

    // PDF DÖKÜMÜ
    window.downloadPDF = () => {
        const list = JSON.parse(localStorage.getItem('kpss_wrongs')) || [];
        const win = window.open('', '', 'height=600,width=800');
        win.document.write('<html><body><h1>KPSS Yanlışlarım</h1>');
        list.forEach((q, i) => win.document.write(`<p><b>${i+1}.</b> ${q.soru}<br>Cevap: ${q.siklar[q.dogru]}</p>`));
        win.document.write('</body></html>'); win.print();
    };
</script>
</body>
</html>
